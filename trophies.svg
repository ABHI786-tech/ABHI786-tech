<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 732 168"
     width="732"
     height="168"
     role="img"
     aria-label="GitHub trophies">

<defs>
<style><![CDATA[
text{
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

@keyframes popCell{
  0%{
    opacity:0;
    transform:translateY(16px) scale(.85)
  }
  70%{
    opacity:1;
    transform:translateY(-3px) scale(1.03)
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes rankGlow{
  0%,100%{opacity:.75}
  50%{opacity:1}
}

@keyframes shineX2{
  0%{
    transform:translateX(-200px) skewX(-15deg)
  }
  60%,100%{
    transform:translateX(812px) skewX(-15deg)
  }
}

.cell{
  opacity:0;
  animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;
  transform-box:fill-box;
  transform-origin:center
}

.rk{
  animation:rankGlow 2.2s ease-in-out infinite
}

.sh2{
  animation:shineX2 5s ease-in-out 2s infinite
}
]]></style>

<!-- Blue theme -->
<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#38bdf8" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<clipPath id="tc">
  <rect x="0" y="0" width="732" height="168" rx="14"/>
</clipPath>

</defs>


<!-- ========================= -->
<!-- Trophy 1 — Pull Shark -->
<!-- ========================= -->

<g class="cell" style="animation-delay:0.30s">

  <rect x="12" y="12"
        width="168"
        height="144"
        rx="14"
        fill="#081525"
        stroke="#38bdf8"
        stroke-opacity=".65"
        stroke-width="1.3"/>

  <text x="96"
        y="52"
        text-anchor="middle"
        font-size="30">🦈</text>

  <text class="rk"
        x="164"
        y="40"
        text-anchor="end"
        font-size="24"
        font-weight="bold"
        fill="#38bdf8"
        style="animation-delay:0.70s">
    SSS
  </text>

  <text x="96"
        y="90"
        text-anchor="middle"
        font-size="14"
        font-weight="bold"
        fill="#e6edf3">
    Pull Shark
  </text>

  <text x="96"
        y="112"
        text-anchor="middle"
        font-size="11"
        fill="#94a3b8">
    Github Badge
  </text>

  <rect x="30"
        y="124"
        width="132"
        height="5"
        rx="2.5"
        fill="#102a43"/>

  <rect x="30"
        y="124"
        width="0"
        height="5"
        rx="2.5"
        fill="#38bdf8">

    <animate
      attributeName="width"
      from="0"
      to="132"
      dur="1s"
      begin="0.60s"
      fill="freeze"
      calcMode="spline"
      keySplines=".2 .8 .3 1"/>

  </rect>

</g>


<!-- ========================= -->
<!-- Trophy 2 — Yolo -->
<!-- ========================= -->

<g class="cell" style="animation-delay:0.48s">

  <rect x="192"
        y="12"
        width="168"
        height="144"
        rx="14"
        fill="#081525"
        stroke="#60a5fa"
        stroke-opacity=".65"
        stroke-width="1.3"/>

  <text x="276"
        y="52"
        text-anchor="middle"
        font-size="30">💀</text>

  <text class="rk"
        x="344"
        y="40"
        text-anchor="end"
        font-size="30"
        font-weight="bold"
        fill="#60a5fa"
        style="animation-delay:0.88s">
    S
  </text>

  <text x="276"
        y="90"
        text-anchor="middle"
        font-size="14"
        font-weight="bold"
        fill="#e6edf3">
    Yolo
  </text>

  <text x="276"
        y="112"
        text-anchor="middle"
        font-size="11"
        fill="#94a3b8">
    GitHub Badge
  </text>

  <rect x="210"
        y="124"
        width="132"
        height="5"
        rx="2.5"
        fill="#102a43"/>

  <rect x="210"
        y="124"
        width="0"
        height="5"
        rx="2.5"
        fill="#60a5fa">

    <animate
      attributeName="width"
      from="0"
      to="132"
      dur="1s"
      begin="0.78s"
      fill="freeze"
      calcMode="spline"
      keySplines=".2 .8 .3 1"/>

  </rect>

</g>


<!-- ========================= -->
<!-- Trophy 3 — Committer -->
<!-- Moved from old position 5 -->
<!-- ========================= -->

<g class="cell" style="animation-delay:0.66s">

  <rect x="372"
        y="12"
        width="168"
        height="144"
        rx="14"
        fill="#081525"
        stroke="#38bdf8"
        stroke-opacity=".65"
        stroke-width="1.3"/>

  <text x="456"
        y="52"
        text-anchor="middle"
        font-size="30">💻</text>

  <text class="rk"
        x="524"
        y="40"
        text-anchor="end"
        font-size="30"
        font-weight="bold"
        fill="#38bdf8"
        style="animation-delay:1.06s">
    A
  </text>

  <text x="456"
        y="90"
        text-anchor="middle"
        font-size="14"
        font-weight="bold"
        fill="#e6edf3">
    Committer
  </text>

  <text x="456"
        y="112"
        text-anchor="middle"
        font-size="11"
        fill="#94a3b8">
    Commits 100+
  </text>

  <rect x="390"
        y="124"
        width="132"
        height="5"
        rx="2.5"
        fill="#102a43"/>

  <rect x="390"
        y="124"
        width="0"
        height="5"
        rx="2.5"
        fill="#38bdf8">

    <animate
      attributeName="width"
      from="0"
      to="132"
      dur="1s"
      begin="0.96s"
      fill="freeze"
      calcMode="spline"
      keySplines=".2 .8 .3 1"/>

  </rect>

</g>


<!-- ========================= -->
<!-- Trophy 4 — Creator -->
<!-- Moved from old position 6 -->
<!-- ========================= -->

<g class="cell" style="animation-delay:0.84s">

  <rect x="552"
        y="12"
        width="168"
        height="144"
        rx="14"
        fill="#081525"
        stroke="#2563eb"
        stroke-opacity=".65"
        stroke-width="1.3"/>

  <text x="636"
        y="52"
        text-anchor="middle"
        font-size="30">📦</text>

  <text class="rk"
        x="704"
        y="40"
        text-anchor="end"
        font-size="30"
        font-weight="bold"
        fill="#2563eb"
        style="animation-delay:1.24s">
    A
  </text>

  <text x="636"
        y="90"
        text-anchor="middle"
        font-size="14"
        font-weight="bold"
        fill="#e6edf3">
    Creator
  </text>

  <text x="636"
        y="112"
        text-anchor="middle"
        font-size="11"
        fill="#94a3b8">
    Repos 40+
  </text>

  <rect x="570"
        y="124"
        width="132"
        height="5"
        rx="2.5"
        fill="#102a43"/>

  <rect x="570"
        y="124"
        width="0"
        height="5"
        rx="2.5"
        fill="#2563eb">

    <animate
      attributeName="width"
      from="0"
      to="132"
      dur="1s"
      begin="1.14s"
      fill="freeze"
      calcMode="spline"
      keySplines=".2 .8 .3 1"/>

  </rect>

</g>


<!-- Shine -->
<g clip-path="url(#tc)">

  <rect class="sh2"
        x="0"
        y="0"
        width="140"
        height="168"
        fill="url(#shg2)"/>

</g>

</svg>
