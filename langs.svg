<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 330"
     width="760"
     height="330"
     role="img"
     aria-label="Languages and technologies I am learning">

<defs>

<style><![CDATA[
text{
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px) scale(.96)
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes shineX{
  0%{
    transform:translateX(-180px) skewX(-15deg)
  }
  60%,100%{
    transform:translateX(900px) skewX(-15deg)
  }
}

@keyframes glow{
  0%,100%{opacity:.8}
  50%{opacity:1}
}

.pill{
  opacity:0;
  animation:fadeUp .45s ease forwards
}

.title{
  animation:glow 3s ease-in-out infinite
}

.sh{
  animation:shineX 5s ease-in-out 2s infinite
}
]]></style>


<!-- Blue title gradient -->
<linearGradient id="tg"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%">
    <animate
      attributeName="stop-color"
      values="#38bdf8;#60a5fa;#38bdf8"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>

  <stop offset="100%">
    <animate
      attributeName="stop-color"
      values="#2563eb;#38bdf8;#2563eb"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>

</linearGradient>


<!-- Card background -->
<linearGradient id="bg"
                x1="0"
                y1="0"
                x2="0"
                y2="1">

  <stop offset="0%" stop-color="#081525"/>
  <stop offset="100%" stop-color="#050e19"/>

</linearGradient>


<!-- Shine -->
<linearGradient id="shg"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%"
        stop-color="#fff"
        stop-opacity="0"/>

  <stop offset="50%"
        stop-color="#38bdf8"
        stop-opacity=".08"/>

  <stop offset="100%"
        stop-color="#fff"
        stop-opacity="0"/>

</linearGradient>


<clipPath id="card">
  <rect x="1"
        y="1"
        width="758"
        height="328"
        rx="16"/>
</clipPath>

</defs>


<!-- CARD -->

<rect x="1"
      y="1"
      width="758"
      height="328"
      rx="16"
      fill="url(#bg)"
      stroke="url(#tg)"
      stroke-width="1.5"/>


<!-- TITLE -->

<text class="title"
      x="24"
      y="35"
      font-size="16"
      font-weight="bold"
      fill="url(#tg)">
  🧠 Languages &amp; Technologies I'm Learning
</text>

<text x="24"
      y="55"
      font-size="10.5"
      fill="#64748b">
  Building • Learning • Exploring
</text>


