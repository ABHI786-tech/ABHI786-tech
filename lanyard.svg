            </g>
            <g class="ltr" style="animation-delay:1.87s">
              <path transform="translate(92.2,0) scale(0.06000,-0.06000)" d="M141 340C66 340 -8 135 -8 59C-8 10 21 -30 80 -30C163 -30 238 38 285 156L270 172C212 58 158 19 113 19C84 19 68 29 68 72C68 160 171 277 171 311C171 330 157 340 141 340ZM198 421C234 421 271 453 271 481C271 509 252 518 228 518C191 518 148 492 148 460C148 433 173 421 198 421Z"/>
            </g>
            <g class="ltr" style="animation-delay:1.96s">
              <path transform="translate(106.9,0) scale(0.06000,-0.06000)" d="M-38 14C-22 -7 2 -15 27 -15C78 69 169 220 250 220C268 220 285 210 285 181C285 138 257 89 257 49C257 9 285 -20 337 -20C417 -20 473 61 516 159L499 173C463 101 406 20 358 20C346 20 334 28 334 49C334 93 373 138 373 199C373 246 346 292 289 292C221 292 152 225 100 156C111 196 117 229 117 245C117 264 104 275 82 275C61 275 39 261 30 251C30 165 -35 28 -38 14Z"/>
            </g>
            <g class="ltr" style="animation-delay:2.05s">
              <path transform="translate(135.4,0) scale(0.06000,-0.06000)" d="M360 263C360 311 314 343 257 343C119 343 -26 158 -26 41C-26 -18 12 -47 56 -47C107 -47 148 -7 201 57C201 16 227 -30 284 -30C359 -30 438 45 487 154L468 173C408 59 344 17 312 17C290 17 282 36 282 53C282 97 339 159 339 185C339 202 316 211 303 215C338 216 360 229 360 263ZM284 213C233 145 138 4 77 4C61 4 54 13 54 36C54 128 166 306 259 306C293 306 301 281 301 254C301 240 300 230 296 217C295 217 293 218 292 218C289 218 286 216 284 213Z"/>
            </g>
            <g class="ltr" style="animation-delay:2.14s">
              <path transform="translate(162.1,0) scale(0.06000,-0.06000)" d="M-20 86C-20 21 16 -51 117 -51C178 -51 230 -25 252 30C316 40 365 88 391 164L379 173C343 104 302 70 261 60C263 72 265 85 265 101C265 190 207 278 207 339C207 357 212 367 212 375C211 386 204 395 188 395C164 395 143 375 143 322V312C117 256 79 209 46 175C33 161 -20 164 -20 86ZM185 93C185 86 185 71 182 62C128 75 85 111 64 147C92 176 127 230 151 272C166 210 184 153 185 93ZM110 -7C61 -7 35 40 35 84C35 101 39 109 49 111C73 79 119 44 174 32C161 6 136 -7 110 -7Z"/>
            </g>
            <g class="ltr" style="animation-delay:2.23s">
              <path transform="translate(183.2,0) scale(0.06000,-0.06000)" d="M257 46C257 6 284 -24 335 -24C420 -24 491 59 537 160L521 177C479 89 404 16 360 16C345 16 333 24 333 48C333 92 375 143 375 207C375 252 355 306 287 306C153 306 98 94 86 75C86 82 85 89 85 96C85 145 93 197 119 266C242 338 353 553 353 643C353 676 338 714 310 714C214 714 5 260 5 75C5 15 17 -38 46 -38C125 -38 148 233 250 233C270 233 286 223 286 191C286 149 257 87 257 46ZM305 620C305 574 227 409 140 330C189 475 282 611 305 620Z"/>
            </g>
          </g>
          <text x="210" y="540" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="bold" letter-spacing="2.5">FRONTEND DEVELOPER</text>
          <text x="210" y="558" text-anchor="middle" font-size="10.5" fill="#8b949e">@ABHI786-tech</text>
          <line x1="100" y1="572" x2="320" y2="572" stroke="#2a1f3d" stroke-width="1"/>
          <!-- barcode + tag -->
          <g transform="translate(100,584)">
            <rect x="0" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="5.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="9.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="12.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="16.0" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="21.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="26.0" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="31.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="34.5" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="41.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="45.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="50.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="54.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="58.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="63.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="67.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="72.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="76.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="81.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="84.0" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/>
            <rect x="89.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/>
